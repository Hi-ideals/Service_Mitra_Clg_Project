# Serves the built single-page app and forwards the API to the backend.
#
# Both on one origin on purpose. The refresh token is an HttpOnly cookie, and
# keeping the app and the API same-origin means the browser sends it without
# any CORS or SameSite negotiation - the same arrangement the Vite dev proxy
# provides in development, so behaviour does not change between the two.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # KYC uploads are capped at 5 MB by the API. nginx has to allow at least
    # that or it rejects the request itself, with a 413 the app never sees and
    # cannot explain to the user.
    client_max_body_size 10m;

    # Compresses what benefits from it. Images and the webp category photos are
    # already compressed, so they are left alone.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # --------------------------------------------------------------- API
    location /api/ {
        # `api` is the compose service name - docker resolves it on the
        # private network. It must match docker-compose.yml exactly: nginx
        # resolves upstream names when it loads its config, not per request,
        # so a wrong name stops the container from starting at all rather
        # than failing later on a request.
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The live status stream is server-sent events: it must not be buffered
        # or the client receives nothing until the connection closes, and it
        # must not time out at the default 60s or the stream dies every minute.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    # ----------------------------------------------------------- assets
    # Vite fingerprints these filenames, so a year is safe: a changed file gets
    # a new name rather than a stale cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------- app
    # index.html itself is never cached, so a deploy is picked up on the next
    # load rather than whenever the browser decides to revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: every unknown path is handed to the app, which owns
    # its own 404 page. Without this a refresh on /admin/reports returns a real
    # nginx 404, because no such file exists on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Does not advertise the version in error pages or the Server header.
    server_tokens off;
}
